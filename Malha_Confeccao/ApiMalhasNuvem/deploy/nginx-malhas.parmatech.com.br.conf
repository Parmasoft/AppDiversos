server {
    listen 80;
    listen [::]:80;
    server_name malhas.parmatech.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot-malhas;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malhas.parmatech.com.br;

    # Certbot preencherá estes caminhos somente depois de o DNS apontar ao droplet.
    ssl_certificate /etc/letsencrypt/live/malhas.parmatech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malhas.parmatech.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
