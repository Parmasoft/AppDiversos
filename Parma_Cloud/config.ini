; O SELECT devolve exatamente os aliases usados pelo ParmaCloudSync.
; Nesta primeira versão, somente produtos ativos da empresa 1 serão enviados.
sql =
    SELECT
        P.PRD_ID AS CODIGO,
        P.PRD_DESCRICAO AS DESCRICAO,
        P.PRD_UN_VENDA AS UNIDADE,
        P.PRD_COD_BARRAS AS CODIGO_BARRAS,

        COALESCE(P.PRD_PRECO_VENDA, 0) AS PRECO,
        COALESCE(P.PRD_ESTOQUE, 0) AS ESTOQUE,
        P.PRD_PRECO_CUSTO AS CUSTO,
        P.PRD_STATUS AS ATIVO,
        (
            SELECT FIRST 1 NF.NF_DT_LANCAMENTO
            FROM TB_PRODUTO_CUSTO PC
            JOIN TB_NOTA_FISCAL NF
              ON NF.NF_EMPRESA = PC.PRDC_EMPRESA
             AND NF.NF_ID = PC.PRDC_ORIGEM_ID
            WHERE PC.PRDC_EMPRESA = P.PRD_EMPRESA
              AND PC.PRDC_PRODUTO = P.PRD_ID
              AND PC.PRDC_ORIGEM = 'NOTA'
              AND NF.NF_ENTRADA_SAIDA = 'E'
              AND NF.NF_FORNECEDOR IS NOT NULL
              AND NF.NF_STATUS = 'D'
              AND COALESCE(NF.NF_FINALIDADE, 1) = 1
              AND NF.NF_NATUREZA_OPERACAO IN (3,4,5,6,29,30)
            ORDER BY NF.NF_DT_LANCAMENTO DESC, NF.NF_ID DESC
        ) AS DATA_ULTIMA_COMPRA,
        (
            SELECT FIRST 1 NF.NF_NUMERO
            FROM TB_PRODUTO_CUSTO PC
            JOIN TB_NOTA_FISCAL NF
              ON NF.NF_EMPRESA = PC.PRDC_EMPRESA
             AND NF.NF_ID = PC.PRDC_ORIGEM_ID
            WHERE PC.PRDC_EMPRESA = P.PRD_EMPRESA
              AND PC.PRDC_PRODUTO = P.PRD_ID
              AND PC.PRDC_ORIGEM = 'NOTA'
              AND NF.NF_ENTRADA_SAIDA = 'E'
              AND NF.NF_FORNECEDOR IS NOT NULL
              AND NF.NF_STATUS = 'D'
              AND COALESCE(NF.NF_FINALIDADE, 1) = 1
              AND NF.NF_NATUREZA_OPERACAO IN (3,4,5,6,29,30)
            ORDER BY NF.NF_DT_LANCAMENTO DESC, NF.NF_ID DESC
        ) AS NOTA_ULTIMA_COMPRA,
        (
            SELECT FIRST 1 NF.NF_SERIE
            FROM TB_PRODUTO_CUSTO PC
            JOIN TB_NOTA_FISCAL NF
              ON NF.NF_EMPRESA = PC.PRDC_EMPRESA
             AND NF.NF_ID = PC.PRDC_ORIGEM_ID
            WHERE PC.PRDC_EMPRESA = P.PRD_EMPRESA
              AND PC.PRDC_PRODUTO = P.PRD_ID
              AND PC.PRDC_ORIGEM = 'NOTA'
              AND NF.NF_ENTRADA_SAIDA = 'E'
              AND NF.NF_FORNECEDOR IS NOT NULL
              AND NF.NF_STATUS = 'D'
              AND COALESCE(NF.NF_FINALIDADE, 1) = 1
              AND NF.NF_NATUREZA_OPERACAO IN (3,4,5,6,29,30)
            ORDER BY NF.NF_DT_LANCAMENTO DESC, NF.NF_ID DESC
        ) AS SERIE_ULTIMA_COMPRA
		
    FROM TB_PRODUTO P
    WHERE P.PRD_EMPRESA = 1
      AND P.PRD_STATUS = 'A'
    ORDER BY P.PRD_ID	

